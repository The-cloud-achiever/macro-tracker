<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>History — Macro Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2d7dd2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    /* ── Calendar ── */
    .cal-nav { display:flex; align-items:center; justify-content:space-between; margin:12px 0 8px; }
    .cal-nav h2 { font-size:1rem; font-weight:600; }
    .cal-nav button { background:none; border:none; color:var(--accent); cursor:pointer; font-size:1.2rem; padding:4px 10px; border-radius:6px; }
    .cal-nav button:hover { background:var(--border); }

    .cal-grid {
      display:grid; grid-template-columns:repeat(7,1fr);
      gap:3px; margin-bottom:12px;
    }
    .cal-dow {
      text-align:center; font-size:.65rem; font-weight:600;
      text-transform:uppercase; letter-spacing:.04em;
      color:var(--muted); padding:4px 0;
    }
    .cal-cell {
      aspect-ratio:1; border-radius:8px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      cursor:pointer; position:relative; gap:1px;
      transition:background .15s;
      min-height:40px;
    }
    .cal-cell:hover { background:var(--border); }
    .cal-cell.empty { cursor:default; }
    .cal-cell.empty:hover { background:none; }
    .cal-cell.today .cal-num { background:var(--accent); color:#fff; border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; }
    .cal-num { font-size:.8rem; font-weight:500; line-height:1; }
    .cal-dot {
      width:5px; height:5px; border-radius:50%;
    }
    .cal-dot.ok   { background:var(--bar-ok); }
    .cal-dot.near { background:var(--bar-near); }
    .cal-dot.over { background:var(--bar-over); }
    .cal-kcal { font-size:.55rem; color:var(--muted); line-height:1; }

    /* Legend */
    .cal-legend { display:flex; gap:12px; justify-content:center; margin-bottom:14px; flex-wrap:wrap; }
    .cal-legend-item { display:flex; align-items:center; gap:4px; font-size:.72rem; color:var(--muted); }
    .cal-legend-dot { width:8px; height:8px; border-radius:50%; }

    /* View toggle */
    .view-toggle { display:flex; gap:0; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin:12px 0; }
    .view-toggle button {
      flex:1; padding:8px; background:none; border:none; cursor:pointer;
      font-size:.82rem; color:var(--muted); transition:background .15s, color .15s;
    }
    .view-toggle button.active { background:var(--accent); color:#fff; }
  </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div> Loading…
</div>

<header>
  <div class="header-row">
    <h1>History</h1>
  </div>
</header>

<main class="page">

  <!-- View toggle -->
  <div class="view-toggle">
    <button id="btnCal" class="active">📅 Calendar</button>
    <button id="btnList">📋 List</button>
  </div>

  <!-- Calendar view -->
  <div id="calView">
    <div class="cal-nav">
      <button id="calPrev">&#8249;</button>
      <h2 id="calMonthLabel"></h2>
      <button id="calNext">&#8250;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend">
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--bar-ok)"></div> Under target</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--bar-near)"></div> Near target</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--bar-over)"></div> Over target</div>
    </div>
  </div>

  <!-- List view -->
  <div id="listView" style="display:none;">
    <div id="historyList">
      <div class="empty" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
        <p>No history yet — log some meals first.</p>
      </div>
    </div>
    <div style="text-align:center; margin-top:16px;">
      <button class="btn btn-secondary" id="loadMoreBtn" style="display:none;">Load more</button>
    </div>
  </div>

</main>

<!-- Day detail modal -->
<div class="modal-backdrop hidden" id="dayModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="dayModalTitle">—</h2>
      <button class="btn-icon" id="dayModalClose">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="dayModalContent"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Today
  </a>
  <a href="history.html" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
    History
  </a>
  <a href="body.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l4-8 4 6 3-4 4 6"/></svg>
    Body
  </a>
  <a href="settings.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Settings
  </a>
</nav>

<div class="toast" id="toast"></div>

<script src="js/auth.js"></script>
<script src="js/github-api.js"></script>
<script src="js/targets.js"></script>
<script>checkAuth();</script>
<script>
// ── Shared state ──
let allDates  = [];
let loadedCount = 0;
let targets   = null;
let dayCache  = {};   // date -> log data
let calYear, calMonth;  // currently displayed calendar month

const PAGE_SIZE = 30;
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function todayStr() { return new Date().toLocaleDateString('en-CA'); }

function fmtDateLong(d) {
  if (d === todayStr()) return 'Today';
  const dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString('en-US', { weekday:'short', month:'long', day:'numeric', year:'numeric' });
}

// ── Init ──
async function init() {
  const today = new Date();
  calYear  = today.getFullYear();
  calMonth = today.getMonth();

  // Always render the calendar shell with current month dates
  renderCalendar();

  if (!GH.isConfigured()) {
    document.getElementById('loadingOverlay').classList.add('hidden');
    showToast('Set up GitHub in Settings first', 4000);
    return;
  }
  try {
    const [files, targRes] = await Promise.all([
      GH.listDir('logs'),
      GH.readJSON('targets.json'),
    ]);
    targets = targRes?.data || null;
    allDates = files
      .filter(f => f.name.endsWith('.json'))
      .map(f => f.name.replace('.json',''))
      .sort((a,b) => b.localeCompare(a));

    // Load data for current month and re-render with dots
    await loadMonthData(calYear, calMonth);
    renderCalendar();

    document.getElementById('emptyState').style.display = allDates.length ? 'none' : '';
  } catch (e) {
    showToast('Error: ' + e.message, 5000);
  }
  document.getElementById('loadingOverlay').classList.add('hidden');
}

// ── Load a month's data into dayCache ──
async function loadMonthData(year, month) {
  const prefix = `${year}-${String(month + 1).padStart(2,'0')}`;
  const needed = allDates.filter(d => d.startsWith(prefix) && !dayCache[d]);
  if (!needed.length) return;
  const results = await Promise.all(needed.map(d => GH.readJSON(`logs/${d}.json`).catch(() => null)));
  results.forEach((res, i) => { if (res) dayCache[needed[i]] = res.data; });
}

// ── Calendar rendering ──
function renderCalendar() {
  const label = new Date(calYear, calMonth, 1)
    .toLocaleDateString('en-US', { month:'long', year:'numeric' });
  document.getElementById('calMonthLabel').textContent = label;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  // Day-of-week headers
  DAYS.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const today = todayStr();

  // Empty leading cells
  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'cal-cell empty';
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const log = dayCache[dateStr];
    const isToday = dateStr === today;
    const hasData = !!log;

    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (isToday ? ' today' : '') + (hasData ? '' : ' no-data');

    let dot = '', kcalLabel = '';
    if (hasData) {
      const meals = log.meals || [];
      const totCal = meals.reduce((s,m) => s + (m.calories || 0), 0);
      const cls = targets?.calories ? statusClass(totCal, targets.calories) : 'ok';
      dot = `<div class="cal-dot ${cls}"></div>`;
      kcalLabel = `<div class="cal-kcal">${totCal >= 1000 ? (totCal/1000).toFixed(1)+'k' : Math.round(totCal)}</div>`;
      cell.addEventListener('click', () => openDay(dateStr));
    }

    cell.innerHTML = `<div class="cal-num">${d}</div>${dot}${kcalLabel}`;
    grid.appendChild(cell);
  }
}

// ── Calendar navigation ──
document.getElementById('calPrev').addEventListener('click', async () => {
  calMonth--;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  document.getElementById('loadingOverlay').classList.remove('hidden');
  await loadMonthData(calYear, calMonth);
  document.getElementById('loadingOverlay').classList.add('hidden');
  renderCalendar();
});
document.getElementById('calNext').addEventListener('click', async () => {
  const now = new Date();
  if (calYear >= now.getFullYear() && calMonth >= now.getMonth()) return;
  calMonth++;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  document.getElementById('loadingOverlay').classList.remove('hidden');
  await loadMonthData(calYear, calMonth);
  document.getElementById('loadingOverlay').classList.add('hidden');
  renderCalendar();
});

// ── List view ──
async function loadBatch() {
  const batch = allDates.slice(loadedCount, loadedCount + PAGE_SIZE);
  if (!batch.length) return;
  const needed = batch.filter(d => !dayCache[d]);
  if (needed.length) {
    const results = await Promise.all(needed.map(d => GH.readJSON(`logs/${d}.json`).catch(() => null)));
    results.forEach((res, i) => { if (res) dayCache[needed[i]] = res.data; });
  }
  batch.forEach(d => { if (dayCache[d]) renderDayRow(d, dayCache[d]); });
  loadedCount += batch.length;
  document.getElementById('loadMoreBtn').style.display = loadedCount < allDates.length ? '' : 'none';
}

function renderDayRow(date, log) {
  const list = document.getElementById('historyList');
  const meals = log.meals || [];
  const totCal  = meals.reduce((s,m) => s + (m.calories || 0), 0);
  const totProt = meals.reduce((s,m) => s + (m.protein_g || 0), 0);
  const totFat  = meals.reduce((s,m) => s + (m.fat_g || 0), 0);
  const cls = targets?.calories ? statusClass(totCal, targets.calories) : 'ok';

  const div = document.createElement('div');
  div.className = 'history-day';
  div.innerHTML = `
    <div class="history-day-header">
      <span class="history-date">${fmtDateLong(date)}</span>
      <span class="history-cal ${cls}">${Math.round(totCal)} kcal</span>
    </div>
    <div class="history-macros">${meals.length} meal${meals.length !== 1?'s':''} · ${Math.round(totProt)}g protein · ${Math.round(totFat)}g fat</div>
    ${targets?.calories ? `<div class="bar-wrap" style="margin-top:8px;"><div class="bar-fill ${cls}" style="width:${pct(totCal, targets.calories)}%"></div></div>` : ''}
  `;
  div.addEventListener('click', () => openDay(date));
  list.appendChild(div);
}

// ── Day detail modal ──
async function openDay(date) {
  if (!dayCache[date]) {
    try {
      const res = await GH.readJSON(`logs/${date}.json`);
      if (res) dayCache[date] = res.data; else return;
    } catch { return; }
  }
  const log = dayCache[date];
  const meals = log.meals || [];
  const totCal  = meals.reduce((s,m) => s + (m.calories || 0), 0);
  const totProt = meals.reduce((s,m) => s + (m.protein_g || 0), 0);
  const totFat  = meals.reduce((s,m) => s + (m.fat_g || 0), 0);

  document.getElementById('dayModalTitle').textContent = fmtDateLong(date);

  const cls = targets?.calories ? statusClass(totCal, targets.calories) : 'ok';
  let html = `
    <div class="macro-grid" style="margin-bottom:4px;">
      <div class="macro-cell"><div class="macro-label">Calories</div><div class="macro-value ${cls}">${Math.round(totCal)}</div></div>
      <div class="macro-cell"><div class="macro-label">Protein</div><div class="macro-value" style="color:var(--text)">${Math.round(totProt)}g</div></div>
      <div class="macro-cell"><div class="macro-label">Fat</div><div class="macro-value" style="color:var(--text)">${Math.round(totFat)}g</div></div>
    </div>`;

  if (targets?.calories) {
    html += `<div class="bar-wrap" style="margin-bottom:16px;"><div class="bar-fill ${cls}" style="width:${pct(totCal, targets.calories)}%"></div></div>`;
  }

  meals.forEach(m => {
    html += `
      <div class="meal-item" style="margin-bottom:8px;">
        <div class="meal-info">
          <div class="meal-time">${m.time || ''}</div>
          <div class="meal-desc">${escHtml(m.description || '')}</div>
          <div class="meal-macros">
            <span>${m.calories || 0} kcal</span>
            <span>${m.protein_g || 0}g protein</span>
            <span>${m.fat_g || 0}g fat</span>
          </div>
        </div>
      </div>`;
  });
  if (!meals.length) html += '<div class="empty" style="padding:20px;"><p>No meals logged</p></div>';

  document.getElementById('dayModalContent').innerHTML = html;
  document.getElementById('dayModal').classList.remove('hidden');
}

// ── View toggle ──
document.getElementById('btnCal').addEventListener('click', () => {
  document.getElementById('calView').style.display  = '';
  document.getElementById('listView').style.display = 'none';
  document.getElementById('btnCal').classList.add('active');
  document.getElementById('btnList').classList.remove('active');
});
document.getElementById('btnList').addEventListener('click', async () => {
  document.getElementById('calView').style.display  = 'none';
  document.getElementById('listView').style.display = '';
  document.getElementById('btnCal').classList.remove('active');
  document.getElementById('btnList').classList.add('active');
  if (loadedCount === 0) {
    document.getElementById('loadingOverlay').classList.remove('hidden');
    await loadBatch();
    document.getElementById('loadingOverlay').classList.add('hidden');
  }
});

document.getElementById('dayModalClose').addEventListener('click', () => document.getElementById('dayModal').classList.add('hidden'));
document.getElementById('dayModal').addEventListener('click', e => { if (e.target === document.getElementById('dayModal')) document.getElementById('dayModal').classList.add('hidden'); });
document.getElementById('loadMoreBtn').addEventListener('click', loadBatch);

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let toastTimer;
function showToast(msg, dur = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), dur);
}

init();
</script>
</body>
</html>
